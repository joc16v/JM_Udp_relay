name: Build and release Windows app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: windows-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - name: Verify relay
        shell: pwsh
        run: |
          dotnet run --project StypeUdpRelay.Tests -c Release
          if ($LASTEXITCODE -ne 0) { throw 'Relay verification failed' }
      - name: Publish portable Windows x64 app
        shell: pwsh
        run: |
          dotnet publish StypeUdpRelay/StypeUdpRelay.csproj -c Release -r win-x64 --self-contained true -o package/StypeUdpRelay/app
          if ($LASTEXITCODE -ne 0) { throw 'Publish failed' }
          Copy-Item README.md package/StypeUdpRelay/README.md
          New-Item -ItemType Directory -Path package/StypeUdpRelay/source | Out-Null
          foreach ($project in @('StypeUdpRelay', 'StypeUdpRelay.Tests')) {
            $destination = "package/StypeUdpRelay/source/$project"
            New-Item -ItemType Directory -Path $destination | Out-Null
            Get-ChildItem -LiteralPath $project -File | Copy-Item -Destination $destination
          }
          Compress-Archive -Path package/StypeUdpRelay -DestinationPath StypeUdpRelay_v1.1_Windows_x64.zip
          (Get-FileHash StypeUdpRelay_v1.1_Windows_x64.zip -Algorithm SHA256).Hash + '  StypeUdpRelay_v1.1_Windows_x64.zip' | Set-Content SHA256SUMS.txt
      - name: Publish GitHub Release
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'v1.1.0'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag StypeUdpRelay_v1.1_Windows_x64.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --target $env:GITHUB_SHA --title 'JM stYpe UDP Relay 1.1' --notes-file RELEASE_NOTES.md
          } else {
            gh release upload $tag StypeUdpRelay_v1.1_Windows_x64.zip SHA256SUMS.txt --repo $env:GITHUB_REPOSITORY --clobber
          }
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed' }
